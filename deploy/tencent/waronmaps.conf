# Reverse proxy for waronmaps.com -> local Rust game server
# Certbot will add the HTTPS (port 443) server block automatically.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    access_log /var/log/nginx/waronmaps.access.log;
    error_log  /var/log/nginx/waronmaps.error.log;

    # Game HTTP API and static frontend
    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket game stream (chat + live world updates).
    # IMPORTANT: this block must exist in BOTH the port-80 and the port-443
    # (HTTPS) server blocks. Certbot sometimes only copies `location /` when it
    # generates the 443 block — if chat/live updates break on HTTPS, verify with:
    #   sudo nginx -T | grep -A 10 "location /ws"
    location /ws {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Health check for uptime monitors (UptimeRobot, etc.)
    location = /health {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
